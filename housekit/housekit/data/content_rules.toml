# Content-flag rules. All patterns are case-insensitive regexes.
# Edit freely; changes take effect on the next `housekit index --rescan`.
# Hand corrections made with `housekit flag` always win over these rules.

[junk]
# Tested against the title (with the version suffix still attached).
title_patterns = [
  "^\\s*(intro|outro|interlude|prelude|prologue|epilogue|skit|segue)\\b",
  "\\b(intro|outro|interlude|skit)\\s*$",
  "\\((intro|outro|interlude|skit|dialogue|spoken)\\)",
  "\\b(dj drop|drop|jingle|station id|sound ?check|tuning|applause|crowd noise|silence|hidden track|untitled)\\b",
  "\\b(karaoke|backing track|instrumental version|minus one)\\b",
  "\\b(comedy|stand.?up|monologue|sketch)\\b",
  "\\b(commentary|interview|voicemail|voice mail|answering machine)\\b",
  "\\btrack \\d+$",
  "^\\s*\\d+\\s*$",
]
# Tested against the raw genre tag.
genre_patterns = [
  "comedy", "spoken", "audiobook", "podcast", "sound ?effect", "karaoke", "meditation", "sleep", "white noise",
]
# Tested against the album title.
album_patterns = [
  "karaoke", "backing tracks", "sound effects", "comedy",
]

[holiday]
title_patterns = [
  "christmas", "xmas", "x-mas", "santa", "jingle bell", "noel", "silent night", "winter wonderland",
  "feliz navidad", "hanukkah|chanukah", "kwanzaa", "little drummer boy", "rudolph", "frosty the snowman",
  "let it snow", "sleigh", "mistletoe", "deck the halls", "o holy night", "silver bells", "auld lang syne",
  "wonderful christmastime", "last christmas", "all i want for christmas", "blue christmas", "happy holiday",
  "twelve days", "12 days", "carol of the bells", "the chipmunk song", "new year'?s",
]
album_patterns = [
  "christmas", "xmas", "holiday", "noel", "winter", "yule",
]
genre_patterns = [
  "christmas", "holiday", "xmas", "seasonal",
]

[live]
# Matched against title, version suffix, and album.
patterns = [
  "\\blive\\b", "unplugged", "in concert", "live at", "live from", "live in", "\\bbootleg\\b",
  "mtv unplugged", "\\bconcert\\b", "\\bat the bbc\\b", "live session",
]
genre_patterns = ["live"]

[instrumental]
patterns = [
  "instrumental", "karaoke", "\\bkaraoke\\b", "backing track",
]
genre_patterns = ["instrumental", "karaoke"]

[explicit]
# Marker patterns tested against title and album. A match forces explicit=true.
patterns = ["\\[explicit\\]", "\\(explicit\\)", "explicit version", "\\bexplicit\\b"]
# Marker patterns that force explicit=false (only when no explicit marker hit first).
clean_patterns = ["\\[clean\\]", "\\(clean\\)", "clean version", "radio edit", "clean edit"]

